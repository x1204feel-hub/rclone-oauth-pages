  <h1>개인정보처리방침</h1>

  <p>이 애플리케이션은 개인용 rclone Google Drive 백업을 위해 사용됩니다.</p>

  <p>애플리케이션은 사용자의 Google Drive 파일에 접근할 수 있으나,
  해당 데이터는 사용자의 개인 백업 목적으로만 처리됩니다.</p>

  <p>사용자 데이터는 외부 제3자에게 판매하거나 공유하지 않습니다.</p>

  <p>OAuth 인증 정보 및 Google Drive 데이터는 개인 컴퓨터와 Google 계정에서만 사용됩니다.</p>

  <p>사용자는 언제든지 Google 계정의 보안 설정에서 애플리케이션 접근 권한을 철회할 수 있습니다.</p>
</body>
